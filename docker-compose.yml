services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-upstream:
    build: .
    command: ["node", "dist/mockUpstream.js"]
    environment:
      MOCK_UPSTREAM_PORT: 9000
    ports:
      - "9000:9000"

  # Two gateway replicas sharing the same Redis, on purpose: this is the
  # whole point of the project. Hit gateway-a and gateway-b interchangeably
  # with the same X-API-Key and the rate limit is still enforced globally,
  # not per-instance — see scripts/multi-instance-test.mjs for the automated
  # version of this same proof.
  gateway-a:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_started
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      UPSTREAM_URL: http://mock-upstream:9000
      RATE_LIMIT: 20
      RATE_WINDOW_SECONDS: 10
      INSTANCE_ID: gateway-a
    ports:
      - "8080:8080"

  gateway-b:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_started
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      UPSTREAM_URL: http://mock-upstream:9000
      RATE_LIMIT: 20
      RATE_WINDOW_SECONDS: 10
      INSTANCE_ID: gateway-b
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway-a
      - gateway-b

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
